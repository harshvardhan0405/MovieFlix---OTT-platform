<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MovieFlix</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">
  <div class="nav-left">
    <div class="logo">MOVIEFLIX</div>

    <div class="nav-links">
      <a href="#home">Home</a>
      <a href="#movies">Movies</a>
      <a href="#series">Series</a>
      <a href="#anime">Anime</a>
    </div>
  </div>

  <div class="nav-right">
    <button class="login-btn" id="openLogin">Login</button>
  </div>
</nav>

<!-- LOGIN -->
<div class="login-popup" id="loginPopup">
  <div class="login-box">
    <span class="close-btn" id="closeLogin">&times;</span>

    <h2>Create Account</h2>

    <input type="text" placeholder="Full Name" required>
    <input type="tel" placeholder="Phone Number" required>

    <select>
      <option>Gender</option>
      <option>Male</option>
      <option>Female</option>
      <option>Other</option>
    </select>

    <input type="email" placeholder="Email Address" required>
    <input type="date">
    <input type="password" placeholder="Password" required>

    <button class="signin-btn">Sign Up</button>
  </div>
</div>

<div class="app">

<!-- HERO -->
<section class="banner" id="home">
  <div class="overlay"></div>

  <div class="banner-content">
    <h1 id="banner-title">Interstellar</h1>

    <div class="movie-info">
      <span id="banner-rating">⭐ 9.2</span>
      <span id="banner-duration">2h 49m</span>
      <span id="banner-episodes">Movie</span>
    </div>

    <p id="banner-desc">
      A journey beyond time and space to save humanity.
      <button id="watchTrailer" class="trailer-btn">▶ Watch Trailer</button>
    </p>

    <div class="banner-buttons">
      <button class="play">▶ Play</button>
      <button class="more">More Info</button>
    </div>
  </div>
</section>

<!-- (ALL YOUR ROWS SAME - NO CHANGE) -->

<!-- MOVIE MODAL -->
<div class="movie-modal" id="movieModal">
  <div class="modal-content">
    <span class="close-modal" id="closeModal">&times;</span>

    <img id="modal-img" src="">
    <h2 id="modal-title">Movie Name</h2>
    <p id="modal-desc">Description here...</p>
  </div>
</div>

<script>
const openLogin = document.getElementById("openLogin");
const closeLogin = document.getElementById("closeLogin");
const loginPopup = document.getElementById("loginPopup");

openLogin.onclick = () => loginPopup.classList.add("show");
closeLogin.onclick = () => loginPopup.classList.remove("show");

window.onclick = (e) => {
  if (e.target == loginPopup) {
    loginPopup.classList.remove("show");
  }
};

// MODAL
const modal = document.getElementById("movieModal");
const modalImg = document.getElementById("modal-img");
const modalTitle = document.getElementById("modal-title");
const modalDesc = document.getElementById("modal-desc");

document.getElementById("closeModal").onclick = () => {
  modal.classList.remove("show");
};

// API KEY
const API_KEY = "cd7fd352bda84df7464e5c07934b2d35";

// TRAILER BUTTON
const trailerBtn = document.getElementById("watchTrailer");

// ONLY ONE EVENT (FIXED DUPLICATE BUG)
const cards = document.querySelectorAll(".card img");

cards.forEach(card => {
  card.addEventListener("click", async () => {

    const title = card.dataset.title;
    const type = card.dataset.type || "movie";

    modal.classList.add("show");
    modalImg.src = card.src;
    modalTitle.innerText = "Loading...";
    modalDesc.innerText = "Fetching data...";

    if (!title) {
      modalTitle.innerText = "No Title";
      modalDesc.innerText = "No data available";
      return;
    }

    try {
      let url = `https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${title}`;

      if (type === "series") {
        url = `https://api.themoviedb.org/3/search/tv?api_key=${API_KEY}&query=${title}`;
      }

      const res = await fetch(url);
      const data = await res.json();
      const result = data.results[0];

      if (result) {
        modalTitle.innerText = result.title || result.name;
        modalDesc.innerText = result.overview;

        if (result.poster_path) {
          modalImg.src = "https://image.tmdb.org/t/p/w500" + result.poster_path;
        }

        let extra = type === "series"
          ? "📺 TV Series"
          : "🎬 Movie | Release: " + result.release_date;

        modalDesc.innerText += "\n\n⭐ Rating: " + result.vote_average + "\n" + extra;

        // TRAILER
        let videoURL = `https://api.themoviedb.org/3/movie/${result.id}/videos?api_key=${API_KEY}`;

        if (type === "series") {
          videoURL = `https://api.themoviedb.org/3/tv/${result.id}/videos?api_key=${API_KEY}`;
        }

        const vidRes = await fetch(videoURL);
        const vidData = await vidRes.json();

        const trailer = vidData.results.find(v => v.type === "Trailer");

        if (trailer) {
          trailerBtn.style.display = "block";
          trailerBtn.onclick = () => {
            window.open(`https://www.youtube.com/watch?v=${trailer.key}`, "_blank");
          };
        } else {
          trailerBtn.style.display = "none";
        }

      } else {
        modalDesc.innerText = "No data found 😢";
      }

    } catch (err) {
      modalDesc.innerText = "Error loading data";
      trailerBtn.style.display = "none";
    }
  });
});
</script>

</body>
</html>
